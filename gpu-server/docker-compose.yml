# HeartCode GPU Server - PEA Configuration
# 8x NVIDIA P104-100 (8GB each), 32GB RAM, 2-core Celeron
#
# Layout uses one-based display slots. Runtime placement always uses GPU UUIDs;
# discovered CUDA/nvidia-smi indices are zero-based and may change after reboot.
#   GPU 1-3: SFW Chat (Stheno v3.4 Q5_K_M) + Vision Embeddings (nomic-embed-vision-v1.5)
#   GPU 4-6: NSFW Chat (Lumimaid v0.2 8B Q5_K_M) + Text Embeddings (nomic-embed-text-v1.5)
#   GPU 7:   Speech STT/TTS (dedicated; Speaches + Kokoro)
#   GPU 8:   Image generation (Segmind SSD-1B via LocalAI)
#
# All 8 cards are healthy as of 2026-07-13. pea-gpu-2 + pea-embed-vision-2 are
# back on GPU 2, leaving GPU 7 dedicated to speech.
#
# GPU UUIDs (from nvidia-smi -L):
#   GPU 0: GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8   (pea-gpu-1, vision-1)
#   GPU 1: GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f   (pea-gpu-2, vision-2)
#   GPU 2: GPU-1f2ba781-081b-56cf-da1a-802759aea70b   (pea-gpu-3, dino-1)
#   GPU 3: GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1   (pea-gpu-4, embed-4)
#   GPU 4: GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b   (pea-gpu-5, embed-5)
#   GPU 5: GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9   (pea-gpu-6, dino-2)
#   GPU 6: GPU-f417c539-26db-94e9-4c8f-c5a775291988   (speech STT/TTS)
#   GPU 7: GPU-c710b68a-493d-0d55-9b1a-f48d8ad71978   (pea-image-1)
#
# Context: 16K tokens (N_CTX=16384) — uses ~1GB KV cache at q8_0
# VRAM budget: ~5.7GB model + ~1GB KV + ~0.35GB embed + ~0.55GB overhead = ~7.6GB / 8GB
#
# Memory Budget (16GB RAM + 16GB swap observed on Pea 2026-08-18):
#   - 3x SFW chat containers: 5GB each = 15GB max, one active request each
#   - 3x NSFW chat containers: 2GB each = 6GB max
#   - 3x text-embed containers (GPU 4-6): 768MB each = 2.25GB max
#   - 3x vision-embed containers (GPU 1-3): 2.5GB each = 7.5GB max (~1.1GB used each)
#   - 2x image containers (GPU 7-8): 4GB each = 8GB max
#   - Note: mem_limit is per-container max, not reserved. Actual use much lower.
#   - Swap available for spikes
#
# Usage:
#   docker compose up -d
#   docker compose logs -f

x-gpu-server-common: &gpu-server-common
  image: local-ai-llama:latest
  restart: unless-stopped
  volumes:
    - ./models:/models:ro
    - ./configs:/app/configs:ro
    - ./server.py:/app/server.py:ro
    - ./metrics.py:/app/metrics.py:ro
    - ./routes.py:/app/routes.py:ro
    - ./gpu_health.py:/app/gpu_health.py:ro
    - ./llama_client.py:/app/llama_client.py:ro
    - ./availability.py:/app/availability.py:ro
    - ./config.py:/app/config.py:ro
    # Pinned chat templates, selected per model via models.yaml `chat_template`.
    - ./chat-templates:/chat-templates:ro
    - ./state:/var/lib/pea-gpu-state
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 2
    start_period: 300s
  networks:
    - gpu-network
  mem_limit: 2048m
  memswap_limit: 3072m

x-gpu-env-common: &gpu-env-common
  N_GPU_LAYERS: 33
  N_CTX: 16384
  N_BATCH: 128
  N_UBATCH: 64
  N_THREADS: 2
  CACHE_REUSE: 256
  CACHE_TYPE_K: q8_0
  CACHE_TYPE_V: q8_0
  EXTRA_ARGS: "--jinja"
  PORT: 8080
  GPU_HEALTH_ENABLED: ${GPU_HEALTH_ENABLED:-0}
  WATCHDOG_INTERVAL_SECONDS: ${WATCHDOG_INTERVAL_SECONDS:-15}
  WATCHDOG_IDLE_FAILURES: ${WATCHDOG_IDLE_FAILURES:-3}
  WATCHDOG_STUCK_REQUEST_SECONDS: ${WATCHDOG_STUCK_REQUEST_SECONDS:-300}
  WATCHDOG_RESTART_LIMIT: ${WATCHDOG_RESTART_LIMIT:-3}
  WATCHDOG_RESTART_WINDOW_SECONDS: ${WATCHDOG_RESTART_WINDOW_SECONDS:-900}
  MAX_IN_FLIGHT_REQUESTS: ${MAX_IN_FLIGHT_REQUESTS:-1}
  # Queue instead of reject: a request that finds the slot busy waits up to
  # this many seconds for it to free (sized to one worst-case generation)
  # before the wrapper answers 429 BACKEND_BUSY + Retry-After. 0 restores the
  # old fail-fast behaviour. See openspec change queue-busy-chat-backends.
  ADMISSION_WAIT_SECONDS: ${ADMISSION_WAIT_SECONDS:-60}

x-embedding-server-common: &embedding-server-common
  image: local-ai-llama:latest
  restart: unless-stopped
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
    interval: 15s
    timeout: 5s
    retries: 2
    start_period: 60s
  networks:
    - gpu-network
  mem_limit: 768m
  memswap_limit: 1024m
  entrypoint: ["llama-server"]
  command:
    - "--model"
    - "/models/nomic-embed-text-v1.5.Q8_0.gguf"
    - "--port"
    - "8090"
    - "--host"
    - "0.0.0.0"
    - "--embedding"
    - "--ctx-size"
    - "2048"
    - "--batch-size"
    - "512"
    - "--n-gpu-layers"
    - "99"
    - "--cache-type-k"
    - "q8_0"
    - "--cache-type-v"
    - "q8_0"

services:
  # =============================================================================
  # SFW CHAT SERVERS (GPU 1-3)
  # =============================================================================

  gpu-server-1:
    <<: *gpu-server-common
    container_name: pea-gpu-1
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}
      EXPECTED_GPU_UUID: ${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}
      SERVER_ID: gpu-1
      MODEL_PATH: ${GPU_1_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_1_MODEL_TYPE:-sfw}
      MODEL_NAME: ${GPU_1_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_1_CHAT_TEMPLATE:-}
    ports:
      - "8080:8080"
    # Sustained SFW load reached ~2.3GiB RSS and the 2GiB cgroup killed only
    # llama-server (Docker OOMKilled remained false because PID 1 survived).
    mem_limit: 8192m
    memswap_limit: 9216m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}']
              capabilities: [gpu]

  gpu-server-2:
    <<: *gpu-server-common
    container_name: pea-gpu-2
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}
      EXPECTED_GPU_UUID: ${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}
      SERVER_ID: gpu-2
      MODEL_PATH: ${GPU_2_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_2_MODEL_TYPE:-sfw}
      MODEL_NAME: ${GPU_2_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_2_CHAT_TEMPLATE:-}
    ports:
      - "8081:8080"
    mem_limit: 8192m
    memswap_limit: 9216m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}']
              capabilities: [gpu]

  gpu-server-3:
    <<: *gpu-server-common
    container_name: pea-gpu-3
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}
      EXPECTED_GPU_UUID: ${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}
      SERVER_ID: gpu-3
      MODEL_PATH: ${GPU_3_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_3_MODEL_TYPE:-sfw}
      MODEL_NAME: ${GPU_3_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_3_CHAT_TEMPLATE:-}
    ports:
      - "8082:8080"
    mem_limit: 8192m
    memswap_limit: 9216m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}']
              capabilities: [gpu]

  # =============================================================================
  # NSFW CHAT SERVERS (GPU 4-7)
  # =============================================================================

  gpu-server-4:
    <<: *gpu-server-common
    container_name: pea-gpu-4
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_4_UUID:-GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1}
      EXPECTED_GPU_UUID: ${PEA_GPU_4_UUID:-GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1}
      SERVER_ID: gpu-4
      MODEL_PATH: ${GPU_4_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_4_MODEL_TYPE:-nsfw}
      MODEL_NAME: ${GPU_4_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_4_CHAT_TEMPLATE:-}
    ports:
      - "8083:8080"
    # Same fix the SFW workers received: sustained generation pushes llama-server
    # past the shared 2GiB cgroup and the memcg kills it (-9) mid-stream while
    # Docker still reports the container healthy (PID 1 survives). Observed again
    # 2026-08-26 on this container.
    mem_limit: 8192m
    memswap_limit: 9216m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_4_UUID:-GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1}']
              capabilities: [gpu]

  # gpu-server-5 (pea-gpu-5, NSFW replica on port 8084) RESTORED 2026-09-16
  # (change restore-nsfw-chat-capacity). It was removed 2026-08-27 for the Qwen3
  # canary; that canary is retired and the SFW canary is pinned to GPU 6, so
  # GPU 5 had only the 234 MiB text-embed on it. GPU 5 corrupts generation when a
  # single process allocates >~7.6 GiB (see evaluate-modern-chat-model-canaries);
  # this replica's llama-server measures ~6.4 GiB at the fleet config, which is
  # why the same workload ran here before. Never place a >7 GiB occupant here.
  gpu-server-5:
    <<: *gpu-server-common
    container_name: pea-gpu-5
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}
      EXPECTED_GPU_UUID: ${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}
      SERVER_ID: gpu-5
      MODEL_PATH: ${GPU_5_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_5_MODEL_TYPE:-nsfw}
      MODEL_NAME: ${GPU_5_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_5_CHAT_TEMPLATE:-}
    ports:
      - "8084:8080"
    # Same memcg headroom as gpu-server-4: sustained generation exceeds the
    # shared 2GiB limit and the container gets killed mid-stream otherwise.
    mem_limit: 8192m
    memswap_limit: 9216m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}']
              capabilities: [gpu]

  gpu-server-6:
    <<: *gpu-server-common
    container_name: pea-gpu-6
    runtime: nvidia
    environment:
      <<: *gpu-env-common
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      EXPECTED_GPU_UUID: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      SERVER_ID: gpu-6
      MODEL_PATH: ${GPU_6_MODEL_PATH:-/models/model.gguf}
      MODEL_TYPE: ${GPU_6_MODEL_TYPE:-nsfw}
      MODEL_NAME: ${GPU_6_MODEL_NAME:-unknown}
      CHAT_TEMPLATE_FILE: ${GPU_6_CHAT_TEMPLATE:-}
    ports:
      - "8085:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}']
              capabilities: [gpu]

  # gpu-server-7 (NSFW, GPU-f417c539 / 1-indexed GPU 7) was REASSIGNED to the
  # multimodal-embed service (see "MULTIMODAL EMBEDDING SERVER" below). A 3B
  # multimodal model needs a dedicated 8GB card and cannot co-locate with an 8B
  # chat model. NSFW chat is now GPU 4-6 (3 GPUs). To roll back, restore this
  # service and embedding-server-7 from git and stop multimodal-embed.

  # =============================================================================
  # EMBEDDING SERVERS (GPU 1-6, co-located with chat servers)
  # Old text-only tier (nomic-embed-text-v1.5). Kept up for rollback during the
  # multimodal cutover; embedding-server-7 was removed (its GPU is now dedicated
  # to multimodal-embed). Decommissioned in change task 7.2 after re-indexing.
  # =============================================================================

  # GPU 1-3 text-embed (embedding-server-1/2/3) REMOVED — these SFW chat GPUs now
  # co-locate vision-embed instead (see vision-embed-1/2/3 below). Text-embed
  # remains on GPU 4-6 (embedding-server-4/5/6). openspec: rebalance-embed-image-gpus

  embedding-server-4:
    <<: *embedding-server-common
    container_name: pea-embed-4
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_4_UUID:-GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1}
    ports:
      - "8093:8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_4_UUID:-GPU-48054f5b-0660-6e89-ec5b-9ac85db7b7b1}']
              capabilities: [gpu]

  embedding-server-5:
    <<: *embedding-server-common
    container_name: pea-embed-5
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}
    ports:
      - "8094:8090"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}']
              capabilities: [gpu]

  # embedding-server-6 (text-embed, GPU-fe0fc635) REMOVED — GPU 6 now hosts
  # dino-embed-2 (DINOv2 visual). Text-embed reduced 3->2 (GPU 4-5, :8093-8094).
  # openspec: serve-dinov2-visual-embed

  # =============================================================================
  # VISION EMBEDDING SERVERS (co-located on SFW chat GPU 1-3)
  # nomic-embed-vision-v1.5 + nomic-embed-text-v1.5 — shared 768-d space, behind
  # heartcode-embed-vision. 3 instances co-located with SFW chat (like text-embed),
  # ~1.1GB VRAM each. MAX_BATCH_SIZE bounded to limit activation memory on the
  # shared 8GB cards. openspec: rebalance-embed-image-gpus.
  # =============================================================================

  vision-embed-1:
    image: local-ai-vision-embed:latest
    build:
      context: ./vision-embed
      dockerfile: Dockerfile
    container_name: pea-embed-vision-1
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}
      EXPECTED_GPU_UUID: ${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}
      GPU_HEALTH_ENABLED: ${GPU_HEALTH_ENABLED:-0}
      SERVER_ID: embed-vision-1
      PORT: 8080
      METRICS_PORT: 9091
      PRECISION: float32
      VISION_MODEL_ID: nomic-ai/nomic-embed-vision-v1.5
      TEXT_MODEL_ID: nomic-ai/nomic-embed-text-v1.5
      MAX_BATCH_SIZE: 4
      HF_HOME: /models
      HF_HUB_CACHE: /models
    volumes:
      - ./models:/models
    ports:
      - "8101:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - gpu-network
    mem_limit: 2560m
    memswap_limit: 4096m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_1_UUID:-GPU-76bfe17d-b576-ee20-f8b7-c70b767a20b8}']
              capabilities: [gpu]

  vision-embed-2:
    image: local-ai-vision-embed:latest
    build:
      context: ./vision-embed
      dockerfile: Dockerfile
    container_name: pea-embed-vision-2
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}
      EXPECTED_GPU_UUID: ${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}
      GPU_HEALTH_ENABLED: ${GPU_HEALTH_ENABLED:-0}
      SERVER_ID: embed-vision-2
      PORT: 8080
      METRICS_PORT: 9091
      PRECISION: float32
      VISION_MODEL_ID: nomic-ai/nomic-embed-vision-v1.5
      TEXT_MODEL_ID: nomic-ai/nomic-embed-text-v1.5
      MAX_BATCH_SIZE: 4
      HF_HOME: /models
      HF_HUB_CACHE: /models
    volumes:
      - ./models:/models
    ports:
      - "8102:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - gpu-network
    mem_limit: 2560m
    memswap_limit: 4096m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_2_UUID:-GPU-c90a5967-fa44-e206-d2a9-9c9f86b2343f}']
              capabilities: [gpu]

  # =============================================================================
  # DINOv2 VISUAL EMBEDDING SERVERS (image-only, co-located on chat GPU 3 + 6)
  # facebook/dinov2-with-registers-large (1024-d) — fine-grained visual / same-
  # object similarity behind heartcode-embed-visual. Replaces vision-embed-3
  # (GPU 3) + embedding-server-6 (GPU 6) for the 2+2+2 embed layout.
  # ⚠️ ~7.5GB/8GB co-located with chat — if OOM, set MODEL_ID=...-base (768-d).
  # openspec: serve-dinov2-visual-embed
  # =============================================================================

  dino-embed-1:
    image: local-ai-dino-embed:latest
    build:
      context: ./dino-embed
      dockerfile: Dockerfile
    container_name: pea-embed-dino-1
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}
      EXPECTED_GPU_UUID: ${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}
      GPU_HEALTH_ENABLED: ${GPU_HEALTH_ENABLED:-0}
      SERVER_ID: embed-dino-1
      PORT: 8080
      METRICS_PORT: 9091
      PRECISION: float32
      MODEL_ID: facebook/dinov2-with-registers-large
      MAX_BATCH_SIZE: 4
      HF_HOME: /models
      HF_HUB_CACHE: /models
    volumes:
      - ./models:/models
    ports:
      - "8104:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - gpu-network
    mem_limit: 3072m
    memswap_limit: 4096m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_3_UUID:-GPU-1f2ba781-081b-56cf-da1a-802759aea70b}']
              capabilities: [gpu]

  dino-embed-2:
    image: local-ai-dino-embed:latest
    build:
      context: ./dino-embed
      dockerfile: Dockerfile
    container_name: pea-embed-dino-2
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      EXPECTED_GPU_UUID: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      GPU_HEALTH_ENABLED: ${GPU_HEALTH_ENABLED:-0}
      SERVER_ID: embed-dino-2
      PORT: 8080
      METRICS_PORT: 9091
      PRECISION: float32
      MODEL_ID: facebook/dinov2-with-registers-large
      MAX_BATCH_SIZE: 4
      HF_HOME: /models
      HF_HUB_CACHE: /models
    volumes:
      - ./models:/models
    ports:
      - "8105:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - gpu-network
    mem_limit: 3072m
    memswap_limit: 4096m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}']
              capabilities: [gpu]

  # =============================================================================
  # SHELVED — multimodal-embed (nomic-embed-multimodal-3b / BiQwen2.5, document
  # retrieval). Superseded on GPU 7 by vision-embed above for the natural-photo
  # use case. Service code kept in ./multimodal-embed and the
  # switch-to-nomic-multimodal-embed openspec change; to revive, restore its
  # service block from git history and assign it a free GPU UUID.

  # =============================================================================
  # IMAGE GENERATION SERVER (GPU 8)
  # Segmind SSD-1B via LocalAI
  # =============================================================================

  image-server:
    image: localai/localai:latest-gpu-nvidia-cuda-12
    container_name: pea-image-1
    restart: unless-stopped
    runtime: nvidia
    entrypoint: ["/config/entrypoint-wrapper.sh"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=${PEA_GPU_8_UUID:-GPU-c710b68a-493d-0d55-9b1a-f48d8ad71978}
      - DEBUG=true
      - THREADS=2
      - MODELS_PATH=/models
      - IMAGE_PATH=/tmp/generated
      - SINGLE_ACTIVE_BACKEND=true
      - BACKENDS_PATH=/backends
    volumes:
      - ./models:/models
      - ./configs:/config:ro
      - image_cache:/tmp/generated
      - image_backends:/backends
    ports:
      - "5100:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - gpu-network
    mem_limit: 4096m
    memswap_limit: 6144m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_8_UUID:-GPU-c710b68a-493d-0d55-9b1a-f48d8ad71978}']
              capabilities: [gpu]

  # =============================================================================
  # SPEECH SERVERS (DEDICATED GPU 7)
  # =============================================================================

  speech-stt:
    image: ghcr.io/speaches-ai/speaches:latest-cuda@sha256:6ec12ebf890a17e0d4b242a8ba9e0eb1fb836e60e8a3c857aea9838d541579ac
    container_name: pea-speech-stt
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}
      STT_MODEL_ID: guillaumekln/faster-whisper-small.en
      PRELOAD_MODELS: '["guillaumekln/faster-whisper-small.en"]'
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__DEVICE_INDEX: 0
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__TTL: -1
      ENABLE_UI: "false"
      LOG_LEVEL: info
    volumes:
      - speech_model_cache:/home/ubuntu/.cache/huggingface/hub
      - ./speech/ensure_stt_loaded.py:/opt/heartcode/ensure_stt_loaded.py:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "/opt/heartcode/ensure_stt_loaded.py"]
      interval: 30s
      timeout: 60s
      retries: 3
      start_period: 300s
    networks:
      - gpu-network
    mem_limit: 4096m
    memswap_limit: 6144m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}']
              capabilities: [gpu]

  speech-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.6.0@sha256:560e5ba33e78597cf35d266a5591c3ce7558dce318b3019fb6d94e28b466080b
    container_name: pea-speech-tts
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}
    volumes:
      - ../private/custom-voice-provider-snapshots/green/cv_custom_dima.pt:/app/api/src/voices/v1_0/cv_custom_dima.pt:ro
    expose:
      - "8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - gpu-network
    mem_limit: 3072m
    memswap_limit: 4096m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}']
              capabilities: [gpu]

  speech-stream-gateway:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: pea-speech-stream-gateway
    restart: unless-stopped
    environment:
      SPEECH_DIRECT_API_KEY: ${SPEECH_DIRECT_API_KEY:?set SPEECH_DIRECT_API_KEY in .env}
    volumes:
      - ./speech/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8201:8080"
    depends_on:
      speech-meter:
        condition: service_healthy
    networks:
      - gpu-network

  speech-meter:
    build: ./speech
    image: local-ai-speech-observability:1
    container_name: pea-speech-meter
    restart: unless-stopped
    command: ["metering_proxy.py"]
    environment:
      STT_UPSTREAM: http://speech-stt:8000
      TTS_UPSTREAM: http://speech-tts:8880
      STT_MODEL: guillaumekln/faster-whisper-small.en
      TTS_MODEL: kokoro
      SPEECH_TTS_ENCODING_PROFILE: ${SPEECH_TTS_ENCODING_PROFILE:-opus-40k}
      CUSTOM_VOICE_MAP_PATH: /private/custom-voice-control/custom-voice-map.json
      CUSTOM_VOICE_REGISTRY_PATH: /private/custom-voice-registry/registry.json
      CUSTOM_VOICE_ARTIFACT_ROOT: /private/custom-voice-artifacts
      CUSTOM_VOICE_CONTROL_PLANE_KEY: ${CUSTOM_VOICE_CONTROL_PLANE_KEY:?set CUSTOM_VOICE_CONTROL_PLANE_KEY in .env}
    volumes:
      - ./speech/evidence:/evidence:ro
      - ../private/custom-voice-control:/private/custom-voice-control
      - ../private/custom-voice-registry:/private/custom-voice-registry
      - ../private/custom-voice-artifacts:/private/custom-voice-artifacts:ro
    ports:
      - "8200:8080"
    depends_on:
      speech-stt:
        condition: service_healthy
      speech-tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gpu-network

  speech-gpu-exporter:
    build: ./speech
    image: local-ai-speech-observability:1
    container_name: pea-speech-gpu-exporter
    restart: unless-stopped
    runtime: nvidia
    command: ["gpu_exporter.py"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}
      SPEECH_GPU_UUID: ${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}
      SPEECH_GPU_PHYSICAL_INDEX: "6"
      SPEECH_GPU_DISPLAY_SLOT: "7"
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_7_UUID:-GPU-f417c539-26db-94e9-4c8f-c5a775291988}']
              capabilities: [gpu]

  # =============================================================================
  # RETIRED — image-server-2 (pea-image-2, :5101). The restored eighth card is
  # reserved for speech rather than restoring a second SSD-1B replica.
  # =============================================================================

  # =============================================================================
  # MONITORING
  # =============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: pea-prometheus
    restart: unless-stopped
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9099:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - gpu-network

  grafana:
    image: grafana/grafana:11.6.2
    container_name: pea-grafana
    restart: unless-stopped
    volumes:
      - ./configs/grafana-datasources.yml:/etc/grafana/provisioning/datasources/pea.yml:ro
      - ./configs/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/pea.yml:ro
      - ./configs/speech-dashboard.json:/var/lib/grafana/dashboards/speech.json:ro
    ports:
      - "3001:3000"
    networks:
      - gpu-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    container_name: pea-blackbox-exporter
    restart: unless-stopped
    volumes:
      - ./configs/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    networks:
      - gpu-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: pea-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    network_mode: host

  # Qwen3 evaluation canary. Holds the GPU-5 chat slot in place of gpu-server-5
  # while an evaluation runs; embedding-server-5 keeps sharing the same card.
  # Runs llama-server directly rather than through the wrapper so sampler
  # parameters reach llama.cpp unmodified.
  #
  # --n-gpu-layers 99 offloads all 37 layers of Qwen3-8B (36 + output). The
  # fleet default of 33 in x-gpu-env-common is sized for Llama-3.1-8B's 32
  # layers; on Qwen3 it left 4 layers on CPU and cost ~38x throughput
  # (0.7 tok/s vs 27 tok/s).
  qwen3-canary:
    # Pinned llama.cpp v0.2.0 / CUDA 12.9 build, canary-only. The fleet stays on
    # :latest (b8027). b8027 hard-crashes on STREAMING Qwen3 requests with
    # "Unexpected empty grammar stack after accepting piece" — see the sampling
    # notes in ../heartcode. Do not point fleet services at this tag until it
    # has proven itself here.
    image: local-ai-llama:v0.2.0
    container_name: qwen3-canary-gpu5
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}
    volumes:
      - ./models:/models:ro
      - ./chat-templates:/chat-templates:ro
    ports:
      - "18085:8080"
    command:
      - llama-server
      - --model
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "16384"
      - --batch-size
      - "128"
      - --ubatch-size
      - "64"
      - --threads
      - "2"
      - --parallel
      - "1"
      - --cont-batching
      - --cache-reuse
      - "256"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      # Pin the template rather than trusting the GGUF's embedded copy. Byte-for-byte
      # the same template this GGUF ships today, so this is a no-op now and a
      # guardrail later: re-quantised GGUFs have shipped broken templates before.
      - --chat-template-file
      - /chat-templates/qwen3.jinja
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 300s
    networks:
      - gpu-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}']
              capabilities: [gpu]

networks:
  gpu-network:
    driver: bridge

volumes:
  prometheus_data:
  image_cache:
  image_backends:
  speech_model_cache:
    name: speech-model-cache
