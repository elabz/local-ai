groups:
  - name: hardware_alerts
    interval: 30s
    rules:
      # GPU Temperature Alerts
      # Warning only: visible in Prometheus/Alertmanager, NOT sent to Slack
      # (routed to the `silent` receiver in configs/alertmanager.yml).
      - alert: GPUTemperatureHigh
        expr: gpu_temperature_celsius > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{$labels.gpu_id}} temperature is high"
          description: "GPU {{$labels.gpu_id}} temperature is {{$value}}°C (threshold: 80°C)"
      
      # The only GPU temperature alert that notifies (owner decision 2026-09-18):
      # critical AND sustained for 10 minutes. Brief spikes under load are
      # normal. `max by (gpu_id)` gives one alert per card; the chat worker and
      # its co-located embed server both export the same card's temperature.
      # gpu_id is the 1-based config slot (nvidia-smi index is gpu_id - 1).
      - alert: GPUTemperatureCritical
        expr: max by (gpu_id) (gpu_temperature_celsius) > 85
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{$labels.gpu_id}} temperature is CRITICAL for 10+ minutes"
          description: "GPU {{$labels.gpu_id}} (config slot; nvidia-smi index is one lower) is at {{$value}}°C, above 85°C for at least 10 minutes"
      
      # CPU Temperature Alerts (supports Intel coretemp, AMD k10temp, and generic hwmon)
      - alert: CPUTemperatureHigh
        expr: |
          max by (instance) (
            node_hwmon_temp_celsius{chip=~".*coretemp.*|.*k10temp.*|.*acpitz.*"}
          ) > 65
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU temperature is high on {{$labels.instance}}"
          description: "CPU temperature is {{$value}}°C (threshold: 65°C for 2-core system)"

      - alert: CPUTemperatureCritical
        expr: |
          max by (instance) (
            node_hwmon_temp_celsius{chip=~".*coretemp.*|.*k10temp.*|.*acpitz.*"}
          ) > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CPU temperature is CRITICAL on {{$labels.instance}}"
          description: "CPU temperature is {{$value}}°C (threshold: 80°C) - IMMEDIATE ACTION REQUIRED"

      # CPU Load Alert (critical for 2-core system)
      - alert: CPULoadHigh
        expr: node_load1 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU load is high on {{$labels.instance}}"
          description: "1-minute load average is {{$value}} (threshold: 2.0 for 2-core system)"

      - alert: CPULoadCritical
        expr: node_load1 > 4
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU load is CRITICAL on {{$labels.instance}}"
          description: "1-minute load average is {{$value}} (threshold: 4.0 for 2-core system) - system may be unresponsive"
      
      # GPU Memory Alerts
      - alert: GPUMemoryHigh
        expr: (gpu_memory_used_bytes / gpu_memory_total_bytes * 100) > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{$labels.gpu_id}} memory usage is high"
          description: "GPU {{$labels.gpu_id}} memory usage is {{$value}}% (threshold: 95%)"
      
      # CPU Usage Alerts
      - alert: CPUUsageHigh
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is high on {{$labels.instance}}"
          description: "CPU usage is {{$value}}% (threshold: 90%)"
      
      # Model Offline Alert
      - alert: ModelOffline
        expr: model_loaded == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Model is offline on {{$labels.job}}"
          description: "GPU server {{$labels.job}} has no model loaded"

      - alert: ChatBackendRestartRateRegression
        expr: increase(watchdog_restart_decisions_total{decision="restart"}[15m]) > 1
        labels:
          severity: critical
        annotations:
          summary: "Chat backend restart rate regressed on {{$labels.instance}}"
          description: "More than one bounded watchdog restart was selected in 15 minutes."

      - alert: ChatBackendRestartSuppressed
        expr: increase(watchdog_restart_decisions_total{decision=~"suppress|continue",reason="restart_suppressed"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Chat backend restart circuit is open on {{$labels.instance}}"
          description: "Rapid restart cycling was suppressed; follow the GPU availability runbook."

      - alert: HeartCodeChatDownstream5xx
        expr: increase(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-chat.*",status_code=~"500|502|504"}[10m]) > 2
        labels:
          severity: critical
        annotations:
          summary: "HeartCode chat downstream failures increased"
          description: "LiteLLM recorded more than two failed HeartCode chat requests in ten minutes."

      # --- queue-busy-chat-backends -------------------------------------------
      # A busy replica now queues (up to ADMISSION_WAIT_SECONDS) and answers
      # 429 BACKEND_BUSY only when the bound is exceeded. Sustained rejections
      # mean demand exceeds slot capacity (or a client ignores its cap).
      - alert: ChatAdmissionRejectedRateHigh
        expr: sum by (instance) (rate(inference_admission_total{status="rejected"}[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Chat admission rejections on {{$labels.instance}}"
          description: "{{ $value | humanize }} req/s exceeded the admission wait bound for 5 minutes (429 BACKEND_BUSY). Check per-key caps and docs/proxy-client-contract.md before adding capacity."

      - alert: ChatAdmissionRejectedShareHigh
        expr: |
          sum by (instance) (rate(inference_admission_total{status="rejected"}[10m]))
          / sum by (instance) (rate(inference_admission_total[10m])) > 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "More than 10% of chat admissions rejected on {{$labels.instance}}"
          description: "Over ten minutes, more than one in ten arrivals waited the full admission bound and were turned away."

      # LiteLLM only cools a deployment for real failures (503/connection,
      # allowed_fails 3). Any cooldown is worth a look; a cooldown attributed
      # to a 429 means the allowed_fails_policy regressed (see the router test).
      - alert: LiteLLMDeploymentCooledDown
        expr: increase(litellm_deployment_cooled_down_total{litellm_model_name=~"heartcode-.*"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "LiteLLM cooled down {{$labels.litellm_model_name}} ({{$labels.api_base}})"
          description: "Deployment was removed from rotation after repeated failures (exception_status={{$labels.exception_status}})."

      - alert: LiteLLMCooldownOnBusy
        expr: increase(litellm_deployment_cooled_down_total{exception_status="429"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "LiteLLM cooled a deployment for a 429 (busy)"
          description: "Busy must never cool a replica. Check router_settings.allowed_fails_policy in litellm/config.base.yaml and re-run gpu-server/tests/integration/test_litellm_gpu_routing.py."

      - alert: LiteLLMCooldownStorm
        expr: sum(increase(litellm_deployment_cooled_down_total{litellm_model_name=~"heartcode-chat.*"}[10m])) > 2
        labels:
          severity: critical
        annotations:
          summary: "Repeated chat deployment cooldowns"
          description: "More than two HeartCode chat cooldowns in ten minutes; a model group may be losing all replicas."

      # Capacity loss per model group (enforce-capacity-guardrails). Labels come
      # from LiteLLM's aggregate counters only: requested_model is the model
      # group, model_id/api_base the deployment. No request content.
      #
      # Busy (429) and unavailable (503) share of a group's traffic. Threshold:
      # 10% over 15 minutes with at least ~1 request/min, so a single overlap
      # burst does not page.
      - alert: LiteLLMModelGroupBusyUnavailableRateHigh
        expr: |
          (
            sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-.*", status_code=~"429|503"}[15m]))
            / sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-.*"}[15m]))
          ) > 0.10
          and on (requested_model)
          sum by (requested_model) (rate(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-.*"}[15m])) > 1/60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.requested_model}}: more than 10% of requests answered 429/503"
          description: "{{ $value | humanizePercentage }} of {{$labels.requested_model}} requests got 429/503 over 15m. See LiteLLMDeploymentBusyUnavailable for the deployments involved and docs/proxy-client-contract.md for client caps."

      # Which deployments are returning 429/503 (names group + deployment).
      - alert: LiteLLMDeploymentBusyUnavailable
        expr: |
          sum by (requested_model, model_id, api_base, exception_status) (
            increase(litellm_deployment_failure_responses_total{requested_model=~"heartcode-.*", exception_status=~"429|503"}[15m])
          ) >= 5
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.requested_model}} deployment {{$labels.model_id}} returned {{$labels.exception_status}}"
          description: "{{ $value | humanize }} {{$labels.exception_status}} responses from {{$labels.api_base}} in 15m."

      # The silent failure this guards against: traffic arrives, nothing
      # succeeds, every health check stays green. Group-level; the matching
      # LiteLLMDeploymentCooledDown / LiteLLMDeploymentBusyUnavailable alerts
      # name the deployment.
      - alert: LiteLLMModelGroupZeroSuccess
        expr: |
          sum by (requested_model) (increase(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-.*"}[1h])) > 0
          unless on (requested_model)
          sum by (requested_model) (increase(litellm_proxy_total_requests_metric_total{requested_model=~"heartcode-.*", status_code=~"2.."}[1h])) > 0
        labels:
          severity: critical
        annotations:
          summary: "{{$labels.requested_model}}: requests received but zero succeeded in the last hour"
          description: "{{ $value | humanize }} requests to {{$labels.requested_model}} in 1h and no 2xx response. Check deployment cooldowns (litellm_deployment_state), gpu-server/scripts/check-placement.py on PEA, and that routed replicas are running."

      - alert: GPUReadinessLost
        # Only where the GPU gate is enabled and has recorded a transition. With
        # GPU_HEALTH_ENABLED=0 (the deployed default) the gauge is never set and
        # reads 0 forever; this rule fired on every worker until 2026-09-18.
        expr: gpu_readiness == 0 and on(instance) (sum by (instance) (gpu_readiness_transitions_total) > 0)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GPU readiness lost on {{$labels.instance}}"
          description: "The backend failed its bounded GPU readiness probe and must remain out of rotation."

      - alert: GPUReadinessFlapping
        expr: sum by (instance) (increase(gpu_readiness_transitions_total{state="unavailable"}[15m])) > 2
        labels:
          severity: critical
        annotations:
          summary: "GPU readiness repeatedly failed on {{$labels.instance}}"
          description: "GPU readiness became unavailable more than twice in 15 minutes; inspect the physical PCI path before restarting."

      - alert: SpeechServiceDown
        expr: probe_success{job="speech-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{$labels.model_type}} is unavailable"
          description: "Speech health probe failed for {{$labels.instance}}"

      - alert: SpeechControlledProbeCorrelationMissing
        expr: speech_controlled_probe_success == 0 or (time() - speech_controlled_probe_timestamp_seconds) > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Speech controlled-probe correlation is missing"
          description: "No fully correlated controlled probe has been retained in the last 24 hours."

      - alert: SpeechGPUInventoryMismatch
        expr: speech_gpu_inventory_match == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Speech GPU UUID/index inventory mismatch"
          description: "{{$labels.gpu_uuid}} was discovered at physical index {{$labels.physical_index_zero_based}}."

      - alert: SpeechUnexpectedCPUFallback
        expr: sum(speech_gpu_process_memory_bytes) == 0 and sum(increase(speech_requests_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Speech inference lacks GPU memory residency"
          description: "Speech traffic occurred without a resident process on the configured GPU."

      - alert: SpeechModelUnavailable
        expr: probe_success{job="speech-health"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{$labels.model_type}} model is unavailable"
          description: "The model-aware health endpoint failed continuously for {{$labels.instance}}."

      - alert: SpeechLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, operation) (rate(speech_request_duration_seconds_bucket{operation="stt"}[15m]))) > 4
          or
          histogram_quantile(0.95, sum by (le, operation) (rate(speech_request_duration_seconds_bucket{operation="tts"}[15m]))) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.operation}} speech p95 latency is sustained above baseline"
          description: "Measured baseline thresholds are 4s for STT and 2s for TTS; the breach persisted for 15 minutes."

      - alert: SpeechErrorRateHigh
        expr: |
          (sum by (operation) (rate(speech_failures_total[10m]))
          / clamp_min(sum by (operation) (rate(speech_requests_total[10m])), 0.001)) > 0.05
          and on (operation) sum by (operation) (increase(speech_requests_total[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.operation}} speech error rate exceeds 5%"
          description: "At least ten requests occurred and the error ratio remained above 5% for 10 minutes."

      - alert: CustomVoiceQueueBacklog
        expr: custom_voice_queue_depth > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Custom voice queue is backed up"
          description: "More than three private build jobs have remained queued for 15 minutes."

      - alert: CustomVoiceGPUReserveLow
        expr: custom_voice_worker_gpu_free_mib < 1024
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Custom voice worker breached the speech GPU reserve"
          description: "Pause the offline worker and verify live speech health."

      - alert: CustomVoiceBuildStalled
        expr: custom_voice_jobs{state="building"} > 0 and custom_voice_worker_phase_duration_seconds{phase="building"} > 21600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Custom voice build exceeded its deadline"
          description: "A private build has remained in the building phase beyond six hours."

      - alert: CustomVoiceRegistryDrift
        expr: increase(custom_voice_registry_drift_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Custom voice registry drift detected"
          description: "An active, missing, mismatched, or unexpected custom artifact was detected."

      - alert: CustomVoiceActivationFailure
        expr: increase(custom_voice_activation_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Custom voice activation failed closed"
          description: "The prior active mapping should remain in service; inspect safe activation events."

      - alert: CustomVoiceCleanupBacklog
        expr: custom_voice_cleanup_backlog > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Custom voice cleanup backlog is growing"
          description: "More than ten verified-deletion requests remain queued."
      
      # Inference Latency Alert
      - alert: InferenceLatencyHigh
        expr: rate(inference_duration_seconds_sum[5m]) / rate(inference_duration_seconds_count[5m]) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inference latency is high on {{$labels.job}}"
          description: "Average inference latency is {{$value}}s (threshold: 30s)"
