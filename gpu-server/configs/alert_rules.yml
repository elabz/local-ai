groups:
  - name: hardware_alerts
    interval: 30s
    rules:
      # GPU Temperature Alerts
      - alert: GPUTemperatureHigh
        expr: gpu_temperature_celsius > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{$labels.gpu_id}} temperature is high"
          description: "GPU {{$labels.gpu_id}} temperature is {{$value}}°C (threshold: 80°C)"
      
      - alert: GPUTemperatureCritical
        expr: gpu_temperature_celsius > 85
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{$labels.gpu_id}} temperature is CRITICAL"
          description: "GPU {{$labels.gpu_id}} temperature is {{$value}}°C (threshold: 85°C) - IMMEDIATE ACTION REQUIRED"
      
      # CPU Temperature Alerts (supports Intel coretemp, AMD k10temp, and generic hwmon)
      - alert: CPUTemperatureHigh
        expr: |
          max by (instance) (
            node_hwmon_temp_celsius{chip=~".*coretemp.*|.*k10temp.*|.*acpitz.*"}
          ) > 65
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CPU temperature is high on {{$labels.instance}}"
          description: "CPU temperature is {{$value}}°C (threshold: 65°C for 2-core system)"

      - alert: CPUTemperatureCritical
        expr: |
          max by (instance) (
            node_hwmon_temp_celsius{chip=~".*coretemp.*|.*k10temp.*|.*acpitz.*"}
          ) > 80
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CPU temperature is CRITICAL on {{$labels.instance}}"
          description: "CPU temperature is {{$value}}°C (threshold: 80°C) - IMMEDIATE ACTION REQUIRED"

      # CPU Load Alert (critical for 2-core system)
      - alert: CPULoadHigh
        expr: node_load1 > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU load is high on {{$labels.instance}}"
          description: "1-minute load average is {{$value}} (threshold: 2.0 for 2-core system)"

      - alert: CPULoadCritical
        expr: node_load1 > 4
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CPU load is CRITICAL on {{$labels.instance}}"
          description: "1-minute load average is {{$value}} (threshold: 4.0 for 2-core system) - system may be unresponsive"
      
      # GPU Memory Alerts
      - alert: GPUMemoryHigh
        expr: (gpu_memory_used_bytes / gpu_memory_total_bytes * 100) > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{$labels.gpu_id}} memory usage is high"
          description: "GPU {{$labels.gpu_id}} memory usage is {{$value}}% (threshold: 95%)"
      
      # CPU Usage Alerts
      - alert: CPUUsageHigh
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is high on {{$labels.instance}}"
          description: "CPU usage is {{$value}}% (threshold: 90%)"
      
      # Model Offline Alert
      - alert: ModelOffline
        expr: model_loaded == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Model is offline on {{$labels.job}}"
          description: "GPU server {{$labels.job}} has no model loaded"

      - alert: GPUReadinessLost
        expr: gpu_readiness == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "GPU readiness lost on {{$labels.instance}}"
          description: "The backend failed its bounded GPU readiness probe and must remain out of rotation."

      - alert: GPUReadinessFlapping
        expr: sum by (instance) (increase(gpu_readiness_transitions_total{state="unavailable"}[15m])) > 2
        labels:
          severity: critical
        annotations:
          summary: "GPU readiness repeatedly failed on {{$labels.instance}}"
          description: "GPU readiness became unavailable more than twice in 15 minutes; inspect the physical PCI path before restarting."

      - alert: SpeechServiceDown
        expr: probe_success{job="speech-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{$labels.model_type}} is unavailable"
          description: "Speech health probe failed for {{$labels.instance}}"

      - alert: SpeechControlledProbeCorrelationMissing
        expr: speech_controlled_probe_success == 0 or (time() - speech_controlled_probe_timestamp_seconds) > 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Speech controlled-probe correlation is missing"
          description: "No fully correlated controlled probe has been retained in the last 24 hours."

      - alert: SpeechGPUInventoryMismatch
        expr: speech_gpu_inventory_match == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Speech GPU UUID/index inventory mismatch"
          description: "{{$labels.gpu_uuid}} was discovered at physical index {{$labels.physical_index_zero_based}}."

      - alert: SpeechUnexpectedCPUFallback
        expr: sum(speech_gpu_process_memory_bytes) == 0 and sum(increase(speech_requests_total[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Speech inference lacks GPU memory residency"
          description: "Speech traffic occurred without a resident process on the configured GPU."

      - alert: SpeechModelUnavailable
        expr: probe_success{job="speech-health"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "{{$labels.model_type}} model is unavailable"
          description: "The model-aware health endpoint failed continuously for {{$labels.instance}}."

      - alert: SpeechLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le, operation) (rate(speech_request_duration_seconds_bucket{operation="stt"}[15m]))) > 4
          or
          histogram_quantile(0.95, sum by (le, operation) (rate(speech_request_duration_seconds_bucket{operation="tts"}[15m]))) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.operation}} speech p95 latency is sustained above baseline"
          description: "Measured baseline thresholds are 4s for STT and 2s for TTS; the breach persisted for 15 minutes."

      - alert: SpeechErrorRateHigh
        expr: |
          (sum by (operation) (rate(speech_failures_total[10m]))
          / clamp_min(sum by (operation) (rate(speech_requests_total[10m])), 0.001)) > 0.05
          and on (operation) sum by (operation) (increase(speech_requests_total[10m])) >= 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{$labels.operation}} speech error rate exceeds 5%"
          description: "At least ten requests occurred and the error ratio remained above 5% for 10 minutes."

      - alert: CustomVoiceQueueBacklog
        expr: custom_voice_queue_depth > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Custom voice queue is backed up"
          description: "More than three private build jobs have remained queued for 15 minutes."

      - alert: CustomVoiceGPUReserveLow
        expr: custom_voice_worker_gpu_free_mib < 1024
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Custom voice worker breached the speech GPU reserve"
          description: "Pause the offline worker and verify live speech health."

      - alert: CustomVoiceBuildStalled
        expr: custom_voice_jobs{state="building"} > 0 and custom_voice_worker_phase_duration_seconds{phase="building"} > 21600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Custom voice build exceeded its deadline"
          description: "A private build has remained in the building phase beyond six hours."

      - alert: CustomVoiceRegistryDrift
        expr: increase(custom_voice_registry_drift_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Custom voice registry drift detected"
          description: "An active, missing, mismatched, or unexpected custom artifact was detected."

      - alert: CustomVoiceActivationFailure
        expr: increase(custom_voice_activation_failures_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Custom voice activation failed closed"
          description: "The prior active mapping should remain in service; inspect safe activation events."

      - alert: CustomVoiceCleanupBacklog
        expr: custom_voice_cleanup_backlog > 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Custom voice cleanup backlog is growing"
          description: "More than ten verified-deletion requests remain queued."
      
      # Inference Latency Alert
      - alert: InferenceLatencyHigh
        expr: rate(inference_duration_seconds_sum[5m]) / rate(inference_duration_seconds_count[5m]) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Inference latency is high on {{$labels.job}}"
          description: "Average inference latency is {{$value}}s (threshold: 30s)"
