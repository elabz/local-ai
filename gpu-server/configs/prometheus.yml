# Prometheus configuration for HeartCode PEA GPU monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # GPU Chat Servers (6 instances, GPU 1-6; embeds co-located, image on GPU 7-8)
  - job_name: 'gpu-chat-servers'
    static_configs:
      - targets: ['pea-gpu-1:9091']
        labels:
          gpu_id: '1'
          model_type: 'sfw'
      - targets: ['pea-gpu-2:9091']
        labels:
          gpu_id: '2'
          model_type: 'sfw'
      - targets: ['pea-gpu-3:9091']
        labels:
          gpu_id: '3'
          model_type: 'sfw'
      - targets: ['pea-gpu-4:9091']
        labels:
          gpu_id: '4'
          model_type: 'nsfw'
      - targets: ['pea-gpu-5:9091']
        labels:
          gpu_id: '5'
          model_type: 'nsfw'
      - targets: ['pea-gpu-6:9091']
        labels:
          gpu_id: '6'
          model_type: 'nsfw'

  # Vision Embedding Servers (nomic-embed-vision-v1.5 + text-v1.5), co-located on SFW chat GPU 1-3
  - job_name: 'vision-embed'
    static_configs:
      - targets: ['pea-embed-vision-1:9091']
        labels:
          gpu_id: '1'
          model_type: 'embed-vision'
      - targets: ['pea-embed-vision-2:9091']
        labels:
          gpu_id: '2'
          model_type: 'embed-vision'
      - targets: ['pea-embed-vision-3:9091']
        labels:
          gpu_id: '3'
          model_type: 'embed-vision'

  # Image Servers (LocalAI metrics, GPU 7-8, load-balanced)
  - job_name: 'image-server'
    static_configs:
      - targets: ['pea-image-1:8080']
        labels:
          gpu_id: '8'
          model_type: 'image'
      - targets: ['pea-image-2:8080']
        labels:
          gpu_id: '7'
          model_type: 'image'
    metrics_path: '/metrics'

  # Speech services expose JSON health endpoints; blackbox-exporter translates
  # their HTTP status into Prometheus probe_success/probe_duration metrics.
  - job_name: 'speech-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://pea-speech-stt:8000/health
        labels:
          model_type: 'speech-stt'
          gpu_uuid: 'GPU-f417c539-26db-94e9-4c8f-c5a775291988'
          physical_index_zero_based: '6'
          display_slot_one_based: '7'
      - targets:
          - http://pea-speech-tts:8880/health
        labels:
          model_type: 'speech-tts'
          gpu_uuid: 'GPU-f417c539-26db-94e9-4c8f-c5a775291988'
          physical_index_zero_based: '6'
          display_slot_one_based: '7'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pea-blackbox-exporter:9115

  - job_name: 'speech-requests'
    static_configs:
      - targets: ['pea-speech-meter:8080']

  - job_name: 'speech-gpu'
    scrape_interval: 5s
    static_configs:
      - targets: ['pea-speech-gpu-exporter:9400']

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter for CPU/system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['192.168.0.144:9100']
        labels:
          instance: 'pea'
