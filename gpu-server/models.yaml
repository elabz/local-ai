# =============================================================================
# models.yaml — SOURCE OF TRUTH for which model runs where and how it's routed.
#
# Edit THIS file to change a model or its tenancy, then regenerate:
#     python3 scripts/render-config.py            # writes the derived files
#     python3 scripts/render-config.py --check    # CI: fail if anything drifted
#
# It renders (all committed + drift-checked in CI, except the gitignored .env):
#   - gpu-server/models.generated.env   GPU_N_MODEL_* for the chat services
#   - litellm/config.yaml                merged from litellm/config.base.yaml + model_list
#   - gpu-server/models.download.tsv     the fetch list for scripts/download-models.sh
#
# Do NOT hand-edit those generated files. Structural changes (turning a chat GPU
# into an embed GPU — a different service image/command) are still manual edits in
# docker-compose.yml; this manifest owns model + routing, not service topology.
# =============================================================================

# PEA GPU host — used to build every LiteLLM api_base (http://<host>:<port>/v1).
host: 192.168.70.144

models:
  # Required per-model key:
  #     min_replicas: <int >= 1>
  # The capacity floor for the group. render-config.py (and --check in CI) fails
  # when fewer deployments are listed. To drop a replica on purpose (canary,
  # maintenance, dead card), lower min_replicas in the same edit with a comment
  # giving the date and reason, e.g.
  #     min_replicas: 2  # lowered 2026-09-16 from 3: GPU 6 hosts the SFW canary
  # Restore the floor when the replica returns.
  #
  # Optional per-model key, valid on `kind: chat` only:
  #     chat_template: llama3 | gemma | qwen3
  # Pins the Jinja chat template from gpu-server/chat-templates/ rather than
  # using whichever template the GGUF embeds. Omit it to keep the GGUF's own
  # template — that is the historical behaviour and remains the default.
  # render-config.py rejects a name with no matching file. See
  # chat-templates/README.md for why pinning is worth doing.

  # --- SFW chat (GPU 1-3) ------------------------------------------------------
  - api_name: heartcode-chat-sfw
    kind: chat
    min_replicas: 3
    mode: chat
    litellm_model: Llama-3.1-8B-Stheno-v3.4-Q5_K_M.gguf
    model_type: sfw
    env_model_name: Sao10K/Llama-3.1-8B-Stheno-v3.4
    aliases: [heartcode-default, heartcode-sfw, heartcode-chat]
    rate_limit: {rpm: 35, tpm: 50000}
    # timeout = ADMISSION_WAIT_SECONDS (60) + wrapper REQUEST_TIMEOUT (180).
    params: {max_tokens: 512, temperature: 0.8, timeout: 240}
    source:
      type: gguf
      repo: bartowski/Llama-3.1-8B-Stheno-v3.4-GGUF
      file: Llama-3.1-8B-Stheno-v3.4-Q5_K_M.gguf
      fallback_file: Llama-3.1-8B-Stheno-v3.4-Q4_K_M.gguf
    deployments:
      - {gpu: 1, port: 8080}
      - {gpu: 2, port: 8081}
      - {gpu: 3, port: 8082}

  # --- NSFW chat (GPU 4-6) -----------------------------------------------------
  - api_name: heartcode-chat-nsfw
    kind: chat
    min_replicas: 3
    mode: chat
    litellm_model: Lumimaid-v0.2-8B-Q5_K_M-imat.gguf
    model_type: nsfw
    env_model_name: NeverSleep/Lumimaid-v0.2-8B
    aliases: [heartcode-nsfw]
    rate_limit: {rpm: 34, tpm: 38000}
    # timeout = ADMISSION_WAIT_SECONDS (60) + wrapper REQUEST_TIMEOUT (180).
    params: {max_tokens: 512, temperature: 0.8, timeout: 240}
    source:
      type: gguf
      repo: Lewdiculous/Lumimaid-v0.2-8B-GGUF-IQ-Imatrix
      file: Lumimaid-v0.2-8B-Q5_K_M-imat.gguf
      fallback_file: Lumimaid-v0.2-8B-Q4_K_M-imat.gguf
    deployments:
      # 8084 (gpu5) restored 2026-09-16 (restore-nsfw-chat-capacity): a single
      # NSFW deployment + zero admission wait + 90s LiteLLM cooldown meant any
      # two overlapping requests took the whole group offline. 8085 (gpu6) was
      # re-listed the same day: the SFW canary is retired from that card and
      # gpu-server-6 + dino-embed-2 are back (operator decision 2026-09-16). A
      # listed-but-dead port burns a real user request each time its cooldown
      # expires, so list a replica here only when its container is actually
      # running.
      - {gpu: 4, port: 8083}
      - {gpu: 5, port: 8084}
      - {gpu: 6, port: 8085}

  # --- Text embeddings, nomic-embed-text-v1.5 GGUF (GPU 4-5, co-located) --------
  - api_name: heartcode-embed
    kind: text-embed
    min_replicas: 2
    mode: embedding
    litellm_model: nomic-embed-text-v1.5.Q8_0.gguf
    id_prefix: heartcode-embed
    # Raised 2026-08-27 from 28 rpm: that starved layered memory — every chat
    # turn embeds the user turn, the reply, and the retrieval query, and the
    # offline Celery memory tasks batch on top, so sustained chat 429'd here and
    # HeartCode silently degraded recall.
    rate_limit: {rpm: 240, tpm: 200000}
    params: {extra_body: {encoding_format: float}}
    source:
      type: gguf
      repo: nomic-ai/nomic-embed-text-v1.5-GGUF
      file: nomic-embed-text-v1.5.Q8_0.gguf
    deployments:
      # 8094 (gpu5) re-listed 2026-09-16: pea-embed-5 had been running healthy
      # but unrouted since the 2026-08-27 canary removal (the canary ended up on
      # GPU 6, not GPU 5).
      - {gpu: 4, port: 8093}
      - {gpu: 5, port: 8094}

  # --- Vision embeddings, nomic CLIP pair, 768-d (GPU 1-2, co-located) ----------
  - api_name: heartcode-embed-vision
    kind: vision-embed
    min_replicas: 2
    mode: embedding
    litellm_model: heartcode-embed-vision
    id_prefix: heartcode-embed-vision
    rate_limit: {rpm: 40, tpm: 30000}
    params: {timeout: 60, extra_body: {encoding_format: float}}
    source:
      type: snapshot
      repos:
        - nomic-ai/nomic-embed-vision-v1.5
        - nomic-ai/nomic-embed-text-v1.5
    deployments:
      - {gpu: 1, port: 8101}
      - {gpu: 2, port: 8102}

  # --- Visual embeddings, DINOv2 ViT-L/14, 1024-d image-only (GPU 3, 6) ---------
  - api_name: heartcode-embed-visual
    kind: visual-embed
    min_replicas: 2
    mode: embedding
    litellm_model: heartcode-embed-visual
    id_prefix: heartcode-embed-visual
    rate_limit: {rpm: 40, tpm: 30000}
    params: {timeout: 60, extra_body: {encoding_format: float}}
    source:
      type: snapshot
      repos:
        - facebook/dinov2-with-registers-large
    deployments:
      - {gpu: 3, port: 8104}
      - {gpu: 6, port: 8105}

  # --- Image generation, Segmind SSD-1B via LocalAI (GPU 8) ---------------------
  # LocalAI auto-downloads the model on first request — nothing to pre-fetch.
  #
  # Single instance: restored GPU 7 is reserved for speech instead of reviving
  # the former second SSD-1B replica.
  - api_name: heartcode-image
    kind: image
    min_replicas: 1
    mode: image_generation
    litellm_model: heartcode-image
    id_prefix: heartcode-image
    source:
      type: localai
    deployments:
      - {gpu: 8, port: 5100}

  # --- Speech-to-text, faster-whisper on dedicated GPU 7 -----------------------
  - api_name: heartcode-stt
    kind: stt
    min_replicas: 1
    mode: audio_transcription
    litellm_model: guillaumekln/faster-whisper-small.en
    id_prefix: heartcode-stt
    rate_limit: {rpm: 60}
    params: {timeout: 180}
    source: {type: container}
    deployments:
      - {gpu: 7, port: 8200}

  # --- Text-to-speech, Kokoro-82M on dedicated GPU 7 --------------------------
  - api_name: heartcode-tts
    kind: tts
    min_replicas: 1
    mode: audio_speech
    litellm_model: kokoro
    id_prefix: heartcode-tts
    rate_limit: {rpm: 60}
    params: {timeout: 180, api_key: os.environ/SPEECH_DIRECT_API_KEY}
    source: {type: container}
    deployments:
      - {gpu: 7, port: 8201}

# Hand-maintained LiteLLM router/general/litellm settings live in
# litellm/config.base.yaml; the generator merges the model_list + model_rate_limits
# + model_group_alias derived from the models above into it.
