# Disposable LiteLLM routing stack. Exercised by test_litellm_gpu_routing.py.
#
#   docker compose -f docker-compose.litellm-routing-test.yml up -d --wait
#   LITELLM_GPU_TEST_URL=http://localhost:4410 pytest test_litellm_gpu_routing.py
#   docker compose -f docker-compose.litellm-routing-test.yml down -v
#
# LITELLM_IMAGE defaults to the same pinned digest as litellm/docker-compose.yml
# so the router semantics proven here are the ones running on Prod.

x-fake-backend: &fake-backend
  image: python:3.11-slim
  entrypoint: ["sh", "-c", "pip install -q fastapi uvicorn && exec python3 -m uvicorn fake_openai_backend:app --host 0.0.0.0 --port 8080"]
  working_dir: /test
  volumes:
    - ./fake_openai_backend.py:/test/fake_openai_backend.py:ro

services:
  gpu-test-healthy:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy}
    ports: ["4411:8080"]

  gpu-test-unavailable:
    <<: *fake-backend
    environment: {BACKEND_MODE: unavailable}

  gpu-test-unavailable-2:
    <<: *fake-backend
    environment: {BACKEND_MODE: unavailable}

  # Alive but its single inference slot is taken: 429 BACKEND_BUSY on chat.
  gpu-test-busy:
    <<: *fake-backend
    environment: {BACKEND_MODE: busy}
    ports: ["4412:8080"]

  # One transient 503, then healthy.
  gpu-test-flaky:
    <<: *fake-backend
    environment: {BACKEND_MODE: flaky}
    ports: ["4413:8080"]

  # Healthy, but fails on demand (POST /fail?n=N) -- one per group under test
  # so each test reads its own counts.
  gpu-test-speech-defaults:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy}
    ports: ["4415:8080"]

  gpu-test-stt:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy}
    ports: ["4416:8080"]

  gpu-test-tts:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy}
    ports: ["4417:8080"]

  # serve-prompt-cache-reuse: three interchangeable chat replicas that say
  # which one served each reply.
  gpu-test-affinity-1:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy, BACKEND_NAME: affinity-1}
    ports: ["4418:8080"]

  gpu-test-affinity-2:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy, BACKEND_NAME: affinity-2}

  gpu-test-affinity-3:
    <<: *fake-backend
    environment: {BACKEND_MODE: healthy, BACKEND_NAME: affinity-3}

  litellm-routing-test:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-latest@sha256:bb0639701796218a3447160e55c0f1097446e4e6085df7dfd39f476d4143743f}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: test-gpu-routing-key
    volumes:
      - ./litellm_gpu_routing.yaml:/app/config.yaml:ro
      # The production patch and callback, mounted exactly as litellm/docker-compose.yml does.
      - ../../../litellm/patches/least_busy.py:/usr/lib/python3.13/site-packages/litellm/router_strategy/least_busy.py:ro
      - ../../../litellm/session_affinity.py:/app/session_affinity.py:ro
    ports:
      - "4410:4000"
    depends_on:
      - gpu-test-healthy
      - gpu-test-unavailable
      - gpu-test-unavailable-2
      - gpu-test-busy
      - gpu-test-flaky
      - gpu-test-speech-defaults
      - gpu-test-stt
      - gpu-test-tts
      - gpu-test-affinity-1
      - gpu-test-affinity-2
      - gpu-test-affinity-3
