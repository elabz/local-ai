services:
  sfw-model-canary:
    image: ${CANARY_IMAGE:-local-ai-llama:v0.2.0}
    container_name: ${SFW_CANARY_CONTAINER:-pea-sfw-model-canary-gpu5}
    restart: "no"
    runtime: nvidia
    mem_limit: 8g
    memswap_limit: 10g
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SFW_CANARY_GPU_UUID:-${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}}
    volumes:
      - ./models:/models:ro
    ports:
      - "${SFW_CANARY_PORT:-18085}:8080"
    entrypoint: ["llama-server"]
    command:
      - "--model"
      - "/models/${SFW_CANARY_MODEL:?set SFW_CANARY_MODEL}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--n-gpu-layers"
      - "99"
      - "--ctx-size"
      - "${CANARY_CONTEXT:-4096}"
      - "--batch-size"
      - "${CANARY_BATCH:-128}"
      - "--ubatch-size"
      - "${CANARY_UBATCH:-64}"
      - "--threads"
      - "2"
      - "--parallel"
      - "1"
      - "--cache-type-k"
      - "${CANARY_CACHE_TYPE:-q8_0}"
      - "--cache-type-v"
      - "${CANARY_CACHE_TYPE:-q8_0}"
      # Prefix KV reuse, matching CACHE_REUSE on the production chat workers.
      # Without it every turn re-ingests the whole prompt: layered memory varies
      # the context between turns, so a strict prefix match fails and TTFA pays
      # full ingestion each time (~5s at only ~1k tokens on the 12B).
      - "--cache-reuse"
      - "${CANARY_CACHE_REUSE:-256}"
      - "--jinja"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${SFW_CANARY_GPU_UUID:-${PEA_GPU_5_UUID:-GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b}}']
              capabilities: [gpu]

  nsfw-model-canary:
    image: ${CANARY_IMAGE:-local-ai-llama:v0.2.0}
    container_name: pea-nsfw-model-canary-gpu6
    restart: "no"
    runtime: nvidia
    mem_limit: 8g
    memswap_limit: 10g
    environment:
      NVIDIA_VISIBLE_DEVICES: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      EXPECTED_GPU_UUID: ${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}
      SERVER_ID: nsfw-model-canary-gpu6
      MODEL_PATH: /models/${NSFW_CANARY_MODEL:?set NSFW_CANARY_MODEL}
      HOST: 0.0.0.0
      PORT: 8080
      LLAMA_SERVER_HOST: 127.0.0.1
      LLAMA_SERVER_PORT: 8081
      N_GPU_LAYERS: 99
      N_CTX: ${CANARY_CONTEXT:-4096}
      N_BATCH: ${CANARY_BATCH:-128}
      N_UBATCH: ${CANARY_UBATCH:-64}
      N_THREADS: 2
      # Prefix KV reuse, same knob as the SFW slot above and the production
      # workers. server.py forwards this to llama-server as --cache-reuse.
      CACHE_REUSE: ${CANARY_CACHE_REUSE:-256}
      CACHE_TYPE_K: ${CANARY_CACHE_TYPE:-q8_0}
      CACHE_TYPE_V: ${CANARY_CACHE_TYPE:-q8_0}
      # Gemma 4 direct-response defaults. The fixed evaluation suite supplies
      # explicit samplers where required; these cover direct/manual probes.
      EXTRA_ARGS: >-
        --jinja
        --top-k ${CANARY_TOP_K:-64}
        --top-p ${CANARY_TOP_P:-0.95}
        --min-p ${CANARY_MIN_P:-0}
        --repeat-penalty ${CANARY_REPEAT_PENALTY:-1.0}
        --presence-penalty ${CANARY_PRESENCE_PENALTY:-0}
      MAX_CONCURRENT_REQUESTS: 1
      MAX_IN_FLIGHT_REQUESTS: 1
      ADMISSION_WAIT_SECONDS: 30
      GPU_HEALTH_ENABLED: 1
      DEFAULT_TOP_K: ${CANARY_TOP_K:-64}
      DEFAULT_TOP_P: ${CANARY_TOP_P:-0.95}
      DEFAULT_REPEAT_PENALTY: ${CANARY_REPEAT_PENALTY:-1.0}
      # The 2026 Gemma 4 campaign requires immediate in-character answers.
      # llama.cpp reads LLAMA_ARG_* variables natively. Keep reasoning off for
      # every candidate and use each GGUF's embedded Gemma 4 Jinja template.
      LLAMA_ARG_REASONING: "off"
      LLAMA_ARG_THINK: "none"
    volumes:
      - ./models:/models:ro
      - ./chat-templates:/chat-templates:ro
      - ./server.py:/app/server.py:ro
      - ./metrics.py:/app/metrics.py:ro
      - ./routes.py:/app/routes.py:ro
      - ./gpu_health.py:/app/gpu_health.py:ro
      - ./llama_client.py:/app/llama_client.py:ro
      - ./availability.py:/app/availability.py:ro
      - ./config.py:/app/config.py:ro
      - ./state:/var/lib/pea-gpu-state
    ports:
      - "${NSFW_CANARY_PORT:-18086}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${PEA_GPU_6_UUID:-GPU-fe0fc635-7c25-49b8-866e-3e4f9ce7efc9}']
              capabilities: [gpu]
