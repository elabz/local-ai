services:
  qwen3-canary:
    image: local-ai-llama:v0.2.0
    container_name: qwen3-canary-gpu5
    restart: unless-stopped
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: GPU-d8525241-21cb-a127-b4d8-d72b9ac32b1b
    volumes:
      - ./models:/models:ro
      - ./chat-templates:/chat-templates:ro
    ports:
      - "18085:8080"
    mem_limit: 6144m
    memswap_limit: 7168m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
    command:
      - llama-server
      - --model
      - /models/Qwen3-8B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --n-gpu-layers
      - "99"
      - --ctx-size
      - "16384"
      - --batch-size
      - "128"
      - --ubatch-size
      - "64"
      - --threads
      - "2"
      - --parallel
      - "1"
      - --cont-batching
      - --cache-reuse
      - "256"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --jinja
      - --chat-template-file
      - /chat-templates/qwen3.jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --reasoning
      - "off"
