# Local AI - LiteLLM Proxy: hand-maintained base settings.
#
# This file holds everything EXCEPT the model list and its per-model routing,
# which are generated from gpu-server/models.yaml. The generator
# (gpu-server/scripts/render-config.py) merges:
#   - model_list                         (from the manifest)
#   - router_settings.model_rate_limits  (from each model's rate_limit)
#   - router_settings.model_group_alias  (from each model's aliases)
# into this base to produce litellm/config.yaml. Edit routing knobs, retries,
# timeouts, auth, etc. HERE; edit models/tenancy in the manifest.

# Router settings for load balancing
router_settings:
  routing_strategy: "least-busy"
  # Two bounded retries: a busy replica (429 BACKEND_BUSY) or one transient
  # 503 is retried on a sibling without amplifying a real outage.
  num_retries: 2
  retry_after: 3
  # Default per-request timeout for non-chat routes. Chat deployments carry
  # their own `timeout: 240` (60s admission wait + 180s generation ceiling)
  # via models.yaml params; general_settings.request_timeout must be >= that.
  timeout: 180
  # Busy is not failure. Backends answer 429 BACKEND_BUSY when their bounded
  # admission queue overflows, which the router treats as a routing hint, not
  # a deployment failure. Cooldown is reserved for connection-level / 503
  # failures and needs three of them in the window; the cooldown itself is no
  # longer than a typical generation so a transient blip does not remove a
  # replica for longer than the request it interrupted.
  # (queue-busy-chat-backends; verified against the pinned image in
  # gpu-server/tests/integration/test_litellm_gpu_routing.py)
  allowed_fails: 3
  cooldown_time: 20
  # REQUIRED for the above to mean what it says. LiteLLM (1.81.9) only uses
  # count-based cooldowns when allowed_fails differs from its default (3) or an
  # allowed_fails_policy is present; otherwise it falls back to a heuristic
  # that cools a deployment on its FIRST 429 whenever a sibling exists, which
  # is exactly the busy->outage amplification this change removes. With a
  # policy set, 429 BACKEND_BUSY effectively never cools a replica, and every
  # other failure class (503, timeout, connection) uses allowed_fails above.
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 1000000

  # Health check settings
  enable_health_check: true

# Isolated evaluation routes that are not part of the production GPU manifest.
# These are intentionally unaliased and must not affect normal model routing.
#
# One model is loaded per canary slot and llama.cpp ignores the requested model
# name, so an entry whose model is not the one loaded on its port silently
# serves the wrong model. Retired/stale entries removed 2026-08-27:
#   - heartcode-chat-qwen3-canary (trial concluded; 18085 now serves gemma-3-12b)
#   - heartcode-chat-gemma-3-4b-canary (never loaded; 18085 serves gemma-3-12b)
#   - heartcode-chat-huihui-qwen3-nsfw-canary (trial concluded; 18086 now serves
#     the Gemma 4 Luchador canary)
# Add an entry only when its model is actually loaded on the slot. Trial
# records: HeartCode repo, docs/model-canary-log.md.
extra_model_list:
  - model_name: heartcode-chat-gemma-3-12b-canary
    litellm_params:
      model: openai/gemma-3-12b-it-Q4_K_M.gguf
      api_base: http://192.168.70.144:18085/v1
      api_key: sk-local
      max_tokens: 512
      temperature: 0.8
    model_info:
      id: gemma-3-12b-canary-gpu5
      mode: chat
  - model_name: heartcode-chat-gemma4-luchador-nsfw-canary
    litellm_params:
      model: openai/rpDungeon_Gemma-4-E4B-Luchador-Q5_K_M.gguf
      api_base: http://192.168.70.144:18086/v1
      api_key: sk-local
      max_tokens: 512
      temperature: 0.8
    model_info:
      id: gemma4-luchador-nsfw-canary-gpu6
      mode: chat

# General settings - PostgreSQL-backed API key management
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # Concurrency limits
  # 6 chat GPUs * 2 concurrent each = 12, + 1 embed + 4 speech = 17 max safe
  max_parallel_requests: 9
  global_max_parallel_requests: 17

  # Request timeout: >= chat deployment timeout (240 = 60s admission wait +
  # 180s generation ceiling) so the proxy does not cut a queued request first.
  request_timeout: 240

  # Logging
  json_logs: true

  # CORS
  allow_credentials: true

  # Health check interval (seconds)
  health_check_interval: 15

# LiteLLM settings
litellm_settings:
  set_verbose: false
  drop_params: true  # Drop unsupported params instead of erroring
  callbacks:
    - speech_correlation.speech_correlation_callback
    - prometheus

# Environment variables needed:
#   LITELLM_MASTER_KEY - Master key for admin API access
#   DATABASE_URL - PostgreSQL connection string (set in docker-compose)
#   LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST - Optional observability
