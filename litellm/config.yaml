router_settings:
  routing_strategy: least-busy
  num_retries: 1
  retry_after: 3
  timeout: 180
  allowed_fails: 1
  cooldown_time: 90
  enable_health_check: true
  model_rate_limits:
  - model_name: heartcode-chat-sfw
    rpm: 35
    tpm: 50000
  - model_name: heartcode-chat-nsfw
    rpm: 34
    tpm: 38000
  # Raised 2026-08-27: 28 rpm starved layered memory — every chat turn embeds
  # the user turn, the reply, and the retrieval query, and the offline Celery
  # memory tasks batch on top, so sustained chat 429'd here and HeartCode
  # silently degraded recall. Two dedicated embed backends handle this easily.
  - model_name: heartcode-embed
    rpm: 240
    tpm: 200000
  - model_name: heartcode-embed-vision
    rpm: 40
    tpm: 30000
  - model_name: heartcode-embed-visual
    rpm: 40
    tpm: 30000
  - model_name: heartcode-stt
    rpm: 60
  - model_name: heartcode-tts
    rpm: 60
  model_group_alias:
    heartcode-default: heartcode-chat-sfw
    heartcode-sfw: heartcode-chat-sfw
    heartcode-chat: heartcode-chat-sfw
    heartcode-nsfw: heartcode-chat-nsfw
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  max_parallel_requests: 9
  global_max_parallel_requests: 17
  request_timeout: 180
  json_logs: true
  allow_credentials: true
  health_check_interval: 15
litellm_settings:
  set_verbose: false
  drop_params: true
  callbacks:
  - speech_correlation.speech_correlation_callback
  - prometheus
