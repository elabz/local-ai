openapi: 3.1.0
info:
  title: HeartCode Custom Voice Control Plane
  version: 1.1.0
  description: >-
    Private digest-bound contract coordinated with add-admin-custom-voices.
    1.1 (adopt-custom-voice-control-plane-v1 / serve-custom-voice-control-plane)
    adds signed intake pull, the SBOM in build results, the attestation document
    in activation, and registry and deletion reads.
x-heartcode-change: adopt-custom-voice-control-plane-v1
x-local-ai-change: serve-custom-voice-control-plane
x-routing:
  visibility: private
  litellm: forbidden
  public-speech-gateway: forbidden
servers:
  - url: https://pea.internal.example/internal/v1
security:
  - CustomVoiceSignature: []
paths:
  /custom-voice-intakes:
    post:
      operationId: createCustomVoiceIntake
      x-required-scope: custom_voice.build
      description: >-
        Pull the samples into an immutable intake on Pea. Pea fetches each
        fetch_url itself, only from an operator-configured origin allow-list,
        without following redirects, within the profile's byte cap, and
        verifies each audio_sha256 and the declared PCM format before writing
        anything. The resulting manifest is benchmark-intake.v1 and also records
        stable_voice_id and version for the build. Idempotency is per intake_id
        over the content, which is every field except fetch_url (signed URLs
        expire, so a retry carries new ones): the same content returns the
        existing manifest_sha256 without fetching again, and different content
        is 409 intake_conflict. A failed fetch is 502 intake_fetch_failed and is
        worth retrying with freshly signed URLs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntakeRequest'}
      responses:
        '201':
          description: Intake written and digest-sealed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Intake'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-builds:
    post:
      operationId: createCustomVoiceBuild
      x-required-scope: custom_voice.build
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBuildRequest'}
      responses:
        '202':
          description: New or idempotently recovered asynchronous build.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuildJob'}
        '409': {$ref: '#/components/responses/Conflict'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-builds/{job_id}:
    get:
      operationId: getCustomVoiceBuild
      x-required-scope: custom_voice.read
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Authoritative job state and safe result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuildJob'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-builds/{job_id}/cancel:
    post:
      operationId: cancelCustomVoiceBuild
      x-required-scope: custom_voice.build
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: Cooperative cancellation requested.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuildJob'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-previews/{preview_id}:
    get:
      operationId: readCustomVoicePreview
      x-required-scope: custom_voice.preview.read
      parameters:
        - name: preview_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/PreviewId'}
        - name: expected_sha256
          in: query
          required: true
          schema: {$ref: '#/components/schemas/Sha256'}
      responses:
        '200':
          description: Digest-verified protected WAV preview.
          content:
            audio/wav:
              schema: {type: string, contentEncoding: binary}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-registry:
    get:
      operationId: readCustomVoiceRegistry
      x-required-scope: custom_voice.read
      responses:
        '200':
          description: Every registered version and which one each voice serves.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryView'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-registry/stage:
    post:
      operationId: stageCustomVoice
      x-required-scope: custom_voice.activate
      description: >-
        Stage a sealed version for review. The artifact manifest digest and
        language come from local-ai's own seal of that artifact, not the
        request. A successful build is already staged, so this is idempotent
        for the same digest.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtifactMutation'}
      responses:
        '200':
          description: Immutable version staged but not published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryVersion'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-registry/activate:
    post:
      operationId: activateCustomVoice
      x-required-scope: custom_voice.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivationRequest'}
      responses:
        '200':
          description: Exact healthy version atomically activated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryVersion'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-registry/rollback:
    post:
      operationId: rollbackCustomVoice
      x-required-scope: custom_voice.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivationRequest'}
      responses:
        '200':
          description: Prior exact version health-probed and activated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryVersion'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-registry/retire:
    post:
      operationId: retireCustomVoice
      x-required-scope: custom_voice.activate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtifactMutation'}
      responses:
        '200':
          description: >-
            Exact version retired. Retiring the active version takes the voice
            out of service: it leaves the serving map before the registry marks
            it retired, and no version is active afterwards.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegistryVersion'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-deletions:
    post:
      operationId: deleteCustomVoiceVersion
      x-required-scope: custom_voice.delete
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ArtifactMutation'}
      responses:
        '202':
          description: Reference-aware deletion queued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionRequest'}
        default: {$ref: '#/components/responses/SafeError'}
  /custom-voice-deletions/{request_id}:
    get:
      operationId: getCustomVoiceDeletion
      x-required-scope: custom_voice.read
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{32}$'}
      responses:
        '200':
          description: Deletion progress.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeletionRequest'}
        default: {$ref: '#/components/responses/SafeError'}
components:
  securitySchemes:
    CustomVoiceSignature:
      type: apiKey
      in: header
      name: X-Custom-Voice-Signature
      description: >-
        Lowercase hex HMAC-SHA256 under the key's secret of
        "{timestamp}\n{nonce}\n{METHOD}\n{path}\n{sha256 hex of body}", with
        X-Custom-Voice-Key-Id, X-Custom-Voice-Timestamp (Unix seconds, within
        300 s) and X-Custom-Voice-Nonce ([A-Za-z0-9_-]{16,128}, single use).
        Callbacks to HeartCode carry X-Custom-Voice-Timestamp, -Nonce and
        -Signature over "{timestamp}\n{nonce}\n{sha256 hex of body}" under the
        callback secret; they carry no result, so the receiver reads the job.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{7,127}$'}
    JobId:
      name: job_id
      in: path
      required: true
      schema: {$ref: '#/components/schemas/JobId'}
  responses:
    Conflict:
      description: Idempotency or immutable-version conflict.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/SafeError'}
    SafeError:
      description: Content-free error.
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/SafeError'}
  schemas:
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    JobId:
      type: string
      pattern: '^cvj_[0-9a-f]{32}$'
    IntakeId:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,126}[A-Za-z0-9]$'
    StableVoiceId:
      type: string
      pattern: '^custom-[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    Version:
      type: string
      pattern: '^v[1-9][0-9]{0,8}$'
    PreviewId:
      type: string
      pattern: '^[0-9a-f]{32}$'
    IntakeRequest:
      type: object
      additionalProperties: false
      required: [schema_version, intake_id, stable_voice_id, version, language, authorization_id, builder_profile, samples]
      properties:
        schema_version: {const: custom-voice-intake-request.v1}
        intake_id: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'}
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        language: {enum: [en-US]}
        authorization_id: {type: string, pattern: '^[A-Za-z0-9._-]{8,128}$'}
        builder_profile: {const: kvoicewalk-multireference.v1}
        samples:
          type: array
          description: The profile's counts exactly (kvoicewalk-multireference.v1 is 6 adaptation, 4 heldout).
          minItems: 10
          maxItems: 10
          items: {$ref: '#/components/schemas/IntakeSample'}
    IntakeSample:
      type: object
      additionalProperties: false
      required: [sample_id, role, fetch_url, audio_sha256, transcript, sample_rate_hz, channels, encoding]
      properties:
        sample_id: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'}
        role: {enum: [adaptation, heldout]}
        fetch_url: {type: string, format: uri, description: 'Short-lived signed URL on an allow-listed origin.'}
        audio_sha256: {$ref: '#/components/schemas/Sha256'}
        transcript: {type: string, minLength: 1, maxLength: 16384}
        sample_rate_hz: {type: integer, minimum: 8000, maximum: 192000}
        channels: {const: 1}
        encoding: {const: pcm_s16le}
    Intake:
      type: object
      additionalProperties: false
      required: [schema_version, intake_id, manifest_sha256, sample_count]
      properties:
        schema_version: {const: custom-voice-intake.v1}
        intake_id: {type: string}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
        sample_count: {type: integer, minimum: 1}
    RegistryView:
      type: object
      additionalProperties: false
      required: [schema_version, voices]
      properties:
        schema_version: {const: custom-voice-registry-view.v1}
        voices:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [stable_voice_id, active_version, versions]
            properties:
              stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
              active_version: {oneOf: [{type: 'null'}, {$ref: '#/components/schemas/Version'}]}
              versions:
                type: array
                items: {$ref: '#/components/schemas/RegistryVersion'}
    CreateBuildRequest:
      type: object
      additionalProperties: false
      required: [schema_version, intake_id, manifest_sha256, stable_voice_id, version, builder_profile, callback]
      properties:
        schema_version: {const: custom-voice-build-request.v1}
        intake_id: {$ref: '#/components/schemas/IntakeId'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        builder_profile: {const: kvoicewalk-multireference.v1}
        callback:
          oneOf:
            - {type: 'null'}
            - $ref: '#/components/schemas/Callback'
    Callback:
      type: object
      additionalProperties: false
      required: [callback_id]
      properties:
        callback_id: {type: string, pattern: '^[A-Za-z0-9._-]{8,128}$'}
      description: Resolves only through an operator-configured allow-list; clients cannot submit a URL.
    BuildJob:
      type: object
      additionalProperties: false
      required: [schema_version, job_id, state, intake_id, manifest_sha256, builder_profile, created_at, updated_at]
      properties:
        schema_version: {const: custom-voice-build-job.v1}
        job_id: {$ref: '#/components/schemas/JobId'}
        state:
          enum: [queued, validating, preprocessing, building, evaluating, succeeded, failed, cancelling, cancelled, deleting]
        intake_id: {$ref: '#/components/schemas/IntakeId'}
        manifest_sha256: {$ref: '#/components/schemas/Sha256'}
        builder_profile: {const: kvoicewalk-multireference.v1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        result:
          oneOf:
            - {type: 'null'}
            - $ref: '#/components/schemas/BuildResult'
        error:
          oneOf:
            - {type: 'null'}
            - $ref: '#/components/schemas/SafeError'
        events:
          type: array
          items: {$ref: '#/components/schemas/JobEvent'}
    JobEvent:
      type: object
      additionalProperties: false
      required: [event_id, state, created_at]
      properties:
        event_id: {type: integer, minimum: 1}
        state: {type: string}
        reason: {type: ['string', 'null']}
        created_at: {type: string}
    BuildResult:
      type: object
      additionalProperties: false
      required: [artifact, sbom, evaluation, compatibility, previews]
      properties:
        artifact: {$ref: '#/components/schemas/ArtifactIdentity'}
        sbom:
          type: object
          additionalProperties: false
          required: [sha256, unresolved_license_count]
          properties:
            sha256: {$ref: '#/components/schemas/Sha256'}
            unresolved_license_count: {type: integer, minimum: 0}
        evaluation:
          type: object
          additionalProperties: false
          required: [objective_outcome, mean_word_error_rate, mean_speaker_similarity, human_naturalness_outcome]
          properties:
            objective_outcome: {enum: [pass, reject]}
            mean_word_error_rate: {type: number, minimum: 0}
            mean_speaker_similarity: {type: number, minimum: -1, maximum: 1}
            human_naturalness_outcome: {enum: [pending, approved, rejected]}
        compatibility: {enum: [pass, reject]}
        previews:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/PreviewReference'}
    ArtifactIdentity:
      type: object
      additionalProperties: false
      required: [stable_voice_id, version, artifact_sha256, artifact_size, artifact_manifest_sha256]
      properties:
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        artifact_sha256: {$ref: '#/components/schemas/Sha256'}
        artifact_size: {type: integer, minimum: 1}
        artifact_manifest_sha256: {$ref: '#/components/schemas/Sha256'}
    PreviewReference:
      type: object
      additionalProperties: false
      required: [preview_id, sha256]
      properties:
        preview_id: {$ref: '#/components/schemas/PreviewId'}
        sha256: {$ref: '#/components/schemas/Sha256'}
    ArtifactMutation:
      type: object
      additionalProperties: false
      required: [stable_voice_id, version, artifact_sha256]
      properties:
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        artifact_sha256: {$ref: '#/components/schemas/Sha256'}
    ActivationRequest:
      # Flat on purpose: allOf over two closed (additionalProperties: false)
      # schemas accepts nothing, which 1.0 did.
      type: object
      additionalProperties: false
      required: [stable_voice_id, version, artifact_sha256, sbom_sha256, admin_attestation_id, admin_attestation]
      properties:
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        artifact_sha256: {$ref: '#/components/schemas/Sha256'}
        sbom_sha256: {$ref: '#/components/schemas/Sha256'}
        admin_attestation_id: {type: string, pattern: '^[A-Za-z0-9._-]{8,128}$'}
        admin_attestation: {$ref: '#/components/schemas/AdminAttestation'}
    AdminAttestation:
      type: object
      description: The digest-bound HeartCode approval local-ai verifies; it never invents one.
      additionalProperties: false
      required: [attestation_id, status, scope, artifact_sha256, sbom_sha256, unresolved_license_count, speaker_authority_confirmed, no_redistribution_confirmed, license_findings_acknowledged]
      properties:
        attestation_id: {type: string, pattern: '^[A-Za-z0-9._-]{8,128}$'}
        status: {const: approved}
        scope: {const: internal_pea}
        artifact_sha256: {$ref: '#/components/schemas/Sha256'}
        sbom_sha256: {$ref: '#/components/schemas/Sha256'}
        unresolved_license_count: {type: integer, minimum: 0}
        speaker_authority_confirmed: {const: true}
        no_redistribution_confirmed: {const: true}
        license_findings_acknowledged: {const: true}
    RegistryVersion:
      type: object
      additionalProperties: false
      required: [stable_voice_id, version, artifact_sha256, state]
      properties:
        stable_voice_id: {$ref: '#/components/schemas/StableVoiceId'}
        version: {$ref: '#/components/schemas/Version'}
        artifact_sha256: {$ref: '#/components/schemas/Sha256'}
        state: {enum: [staged, active, unhealthy, retired, deleted]}
    DeletionRequest:
      type: object
      additionalProperties: false
      required: [request_id, state]
      properties:
        request_id: {type: string, pattern: '^[0-9a-f]{32}$'}
        state: {enum: [queued, verified_deleted, failed]}
    CallbackEvent:
      type: object
      additionalProperties: false
      required: [schema_version, callback_id, event_id, job_id, state, occurred_at]
      properties:
        schema_version: {const: custom-voice-callback.v1}
        callback_id: {type: string}
        event_id: {type: integer, minimum: 1}
        job_id: {$ref: '#/components/schemas/JobId'}
        state: {type: string}
        occurred_at: {type: string, format: date-time}
        reason: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
    SafeError:
      type: object
      additionalProperties: false
      required: [type, code, status]
      properties:
        type: {const: about:blank}
        code: {type: string, pattern: '^[a-z][a-z0-9_]{2,63}$'}
        status: {type: integer, minimum: 400, maximum: 599}
